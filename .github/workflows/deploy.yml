name: Build and deploy with Gold data

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_xAW98Uq2v6UKFo4udnLq9WBl
      VERCEL_PROJECT_ID: prj_vVfqyx5nYWJhRGPnwrz4RRTRhmcj
      PRODUCTION_URL: https://brasileirao.felipesoarws.me

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install --yes rclone

      - name: Configure Google Drive remote
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          if [ -z "$RCLONE_CONFIG_B64" ]; then
            echo "::error::GitHub Actions secret RCLONE_CONFIG_B64 is required."
            exit 1
          fi
          config="$RUNNER_TEMP/rclone.conf"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$config"
          chmod 600 "$config"
          if ! rclone listremotes --config "$config" | grep -qx 'gdrive:'; then
            echo "::error::The rclone config must define a remote named gdrive."
            exit 1
          fi
          echo "RCLONE_CONFIG_PATH=$config" >> "$GITHUB_ENV"

      - name: Download Gold from Google Drive
        run: |
          mkdir -p ./data/gold
          rclone copy gdrive:brasileiraodb/gold ./data/gold --fast-list --config "$RCLONE_CONFIG_PATH"
          test -f ./data/gold/_metadata.json
          test -f ./data/gold/teams.parquet
          test -f ./data/gold/season_standings.parquet
          test -d ./data/gold/matches
          jq -e '.updated_at | strings | select(length > 0)' ./data/gold/_metadata.json >/dev/null

      - name: Set up Python for Parquet conversion
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install Parquet build dependency
        run: python -m pip install -r requirements-build.txt

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Verify Vercel deployment credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add the VERCEL_TOKEN secret to the GitHub repository before deploying."
            exit 1
          fi

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@59.25.4 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build with downloaded Gold data
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATA_ROOT: ./data
        run: npx --yes vercel@59.25.4 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt production output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@59.25.4 deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Verify production health and Gold snapshot
        id: verify-production
        shell: bash
        run: |
          expected_updated_at="$(jq -r '.updated_at' ./data/gold/_metadata.json)"
          status_url="${PRODUCTION_URL}/api/data-status?workflow-check=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          actual_updated_at=""
          for attempt in $(seq 1 12); do
            response="$(curl --silent --show-error --fail --max-time 20 "$status_url" 2>/dev/null || true)"
            actual_updated_at="$(printf '%s' "$response" | jq -r '.lastUpdated // empty' 2>/dev/null || true)"
            if [ "$actual_updated_at" = "$expected_updated_at" ]; then
              break
            fi
            sleep 10
          done
          if [ "$actual_updated_at" != "$expected_updated_at" ]; then
            echo "::error::Production Gold timestamp mismatch. Expected '$expected_updated_at'; got '${actual_updated_at:-no response}'."
            exit 1
          fi
          for route in / /robots.txt /sitemap.xml; do
            if ! curl --silent --show-error --fail --max-time 30 -o /dev/null "${PRODUCTION_URL}${route}"; then
              echo "::error::Production health check failed for ${route}."
              exit 1
            fi
          done
          {
            echo "## Production verification passed"
            echo "- Gold snapshot timestamp: `${actual_updated_at}`"
            echo "- Health checks: `/`, `/robots.txt`, `/sitemap.xml`"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize deployment failure
        if: ${{ failure() }}
        shell: bash
        run: |
          {
            echo "## Production workflow failed"
            echo "Check the failed step and Vercel deployment logs before retrying. If a bad deployment became active, follow [docs/OPERATIONS.md](https://github.com/${GITHUB_REPOSITORY}/blob/master/docs/OPERATIONS.md) to roll back and pause scheduled deployments while investigating."
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
